services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ./.env
        required: false
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PAYLOAD_CMS_URL: http://cms:3000
      NEXT_PUBLIC_PAYLOAD_CMS_URL: ${NEXT_PUBLIC_PAYLOAD_CMS_URL:-http://localhost:${CMS_HOST_PORT:-3001}}
    depends_on:
      - cms
    restart: unless-stopped

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    env_file:
      - path: ./.env
        required: false
      - path: ./cms/.env
        required: false
    ports:
      - "${CMS_HOST_PORT:-3001}:3000"
    environment:
      DATABASE_URL: mongodb://mongo:27017/payload
      NODE_ENV: production
      NEXT_PUBLIC_PAYLOAD_CMS_URL: ${NEXT_PUBLIC_PAYLOAD_CMS_URL:-http://localhost:${CMS_HOST_PORT:-3001}}
      PAYLOAD_SERVER_URL: ${PAYLOAD_SERVER_URL:-}
      LIVE_PREVIEW_URL: ${LIVE_PREVIEW_URL:-http://localhost:${HOST_PORT:-3000}}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - cms_media:/app/media
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    command:
      - --storageEngine=wiredTiger
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 }).ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  cms_media:
  mongo_data: