packageExtensions:
  # payload imports `next` types without declaring it as a dependency/peer,
  # which makes TypeScript resolve the root app's next (React 18) instance.
  # Declaring it as a peer makes pnpm link the cms's next (React 19) instance.
  payload@*:
    peerDependencies:
      next: '*'
    peerDependenciesMeta:
      next:
        optional: true
  # next's bundled styled-jsx types import `react`; without an @types/react peer
  # link, TypeScript falls back to the root workspace's @types/react (React 18).
  next@*:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  # @payloadcms/next's RootLayout types import `react` directly; same fallback
  # problem as above — give it an @types/react peer link too.
  '@payloadcms/next@*':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
